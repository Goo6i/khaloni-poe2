name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full workspace test run on the native Linux target (core + app + spikes).
  test-linux:
    name: Linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native libraries the Linux backend crates link against:
      # pipewire (capture), wayland + xkbcommon (overlay/smithay),
      # tesseract + leptonica (leptess OCR), all found via pkg-config.
      # tesseract-ocr-eng supplies the eng traineddata the OCR tests load
      # at runtime (OcrEngine::new(None, "eng")).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpipewire-0.3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libtesseract-dev \
            libleptonica-dev \
            tesseract-ocr-eng

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The releases ship this exact model, and every OCR threshold in the
      # repo was tuned against it; testing with the distro's copy validated
      # something users never run.
      - name: Fetch the shipped tessdata
        run: |
          mkdir -p "$RUNNER_TEMP/tessdata"
          curl -sSL -o "$RUNNER_TEMP/tessdata/eng.traineddata" \
            https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata

      - name: Test
        run: cargo test -p khaloni-poe2 -p khaloni-poe2-core
        env:
          TESSDATA_PREFIX: ${{ runner.temp }}/tessdata

  # Real Windows build + tests on the MSVC target with full OCR via vcpkg.
  # Slow (vcpkg builds tesseract from source on cache miss), so it runs in
  # parallel with the cheap gnu cross-check below.
  test-windows:
    name: Windows tests (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # vcpkg compiles tesseract+leptonica from source (~20 min); the
      # installed tree is stable per triplet, so cache it. Bump the key
      # suffix to force a rebuild (e.g. after a runner image change).
      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-tesseract-x64-windows-static-md-v1

      - name: Install tesseract via vcpkg
        run: vcpkg install tesseract:x64-windows-static-md

      - name: Fetch eng traineddata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP/tessdata | Out-Null
          Invoke-WebRequest -Uri https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata -OutFile $env:RUNNER_TEMP/tessdata/eng.traineddata

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test -p khaloni-poe2 -p khaloni-poe2-core
        env:
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKG_ROOT: C:\vcpkg
          TESSDATA_PREFIX: ${{ runner.temp }}/tessdata

  # Cross-target type-check for the gnu target — cheap, linker-free, and
  # FULL coverage: the committed leptess-stub gives gnu the ocr cfg too, so
  # even MSVC-only code paths are type-checked here (app/leptess-stub).
  # ring compiles C for
  # the target, hence the mingw-w64 cross compiler.
  windows-check:
    name: Windows cross-check (x86_64-pc-windows-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --target x86_64-pc-windows-gnu -p khaloni-poe2 -p khaloni-poe2-core
