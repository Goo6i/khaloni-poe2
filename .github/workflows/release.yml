name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libpipewire-0.3-dev libwayland-dev libxkbcommon-dev \
            libtesseract-dev libleptonica-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p khaloni-poe2

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/khaloni-poe2
          cp target/release/khaloni-poe2 dist/khaloni-poe2/
          cp app/khaloni-poe2-launch dist/khaloni-poe2/
          cp README.md dist/khaloni-poe2/
          tar -C dist -czf "khaloni-poe2-${TAG}-linux-x86_64.tar.gz" khaloni-poe2
          # The self-updater swaps only the executable, so publish it bare
          # alongside the archive (archives stay the fresh-install path).
          cp target/release/khaloni-poe2 "khaloni-poe2-${TAG}-linux-x86_64"
          # Published by this job, not a separate one: a third job needing
          # its own hosted runner failed to be scheduled three releases
          # running ("not acquired by Runner of type hosted").
          sha256sum "khaloni-poe2-${TAG}-linux-x86_64" > "khaloni-poe2-${TAG}-linux-x86_64.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            khaloni-poe2-*.tar.gz
            khaloni-poe2-*-linux-x86_64
            khaloni-poe2-*-linux-x86_64.sha256
          draft: false

  windows:
    name: Windows zip
    runs-on: windows-latest
    # Serialized after linux only so this job can compose the combined
    # SHA256SUMS from both platforms' checksums without needing a third
    # hosted runner (which GitHub failed to schedule three attempts
    # running). Costs ~10 min of release latency; windows is the long pole.
    needs: linux
    steps:
      - uses: actions/checkout@v4

      # leptess links tesseract + leptonica; on MSVC the *-sys crates
      # resolve them through vcpkg (static, so the zip stays self-contained).
      # vcpkg compiles tesseract+leptonica from source (~20 min); the
      # installed tree is stable per triplet, so cache it. Bump the key
      # suffix to force a rebuild (e.g. after a runner image change).
      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-tesseract-x64-windows-static-md-v1

      - name: Install tesseract via vcpkg
        run: |
          vcpkg install tesseract:x64-windows-static-md
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p khaloni-poe2
        env:
          VCPKGRS_TRIPLET: x64-windows-static-md
          # vcpkg-rs (leptonica-sys/tesseract-sys build scripts) reads
          # VCPKG_ROOT; the runner image only exports VCPKG_INSTALLATION_ROOT.
          VCPKG_ROOT: C:\vcpkg

      - name: Fetch eng traineddata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/khaloni-poe2 | Out-Null
          Invoke-WebRequest -Uri https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata -OutFile dist/khaloni-poe2/eng.traineddata

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Copy-Item target/release/khaloni-poe2.exe dist/khaloni-poe2/
          Copy-Item README.md dist/khaloni-poe2/
          Compress-Archive -Path dist/khaloni-poe2 -DestinationPath "khaloni-poe2-$env:TAG-windows-x86_64.zip"
          Copy-Item target/release/khaloni-poe2.exe "khaloni-poe2-$env:TAG-windows-x86_64.exe"
          $asset = "khaloni-poe2-$env:TAG-windows-x86_64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            khaloni-poe2-*.zip
            khaloni-poe2-*-windows-x86_64.exe
            khaloni-poe2-*-windows-x86_64.exe.sha256
          draft: false

      # Clients released before per-asset .sha256 files existed (v0.2.1)
      # look for a combined SHA256SUMS, so keep publishing one. Composed
      # here, in the job that finishes last, from both sidecars.
      - name: Publish combined SHA256SUMS
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force sums | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*-linux-x86_64.sha256" --dir sums
          $linux = Get-Content (Get-ChildItem sums/*-linux-x86_64.sha256 | Select-Object -First 1).FullName
          $winAsset = "khaloni-poe2-$env:TAG-windows-x86_64.exe"
          $windows = Get-Content "$winAsset.sha256"
          @($linux, $windows) | Out-File -Encoding ascii sums/SHA256SUMS
          Get-Content sums/SHA256SUMS
          gh release upload $env:TAG sums/SHA256SUMS --repo $env:GITHUB_REPOSITORY --clobber
