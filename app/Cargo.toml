[package]
name = "poe2-lens"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "poe2-lens"

[dependencies]
poe2-lens-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
image = "0.25"
tiny-skia = "0.11"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
anyhow = "1"
futures-util = "0.3"
serde_json = "1"
eframe = "0.35.0"

[dev-dependencies]
serde_json = "1"

[lib]
name = "poe2_lens"
path = "src/lib.rs"

[[bin]]
name = "poe2-lens"
path = "src/main.rs"

# The Linux backend stack (Wayland overlay, pipewire/portal capture, uinput
# injection, portal hotkeys, KWin feed, X11 clipboard probe, SNI tray) plus
# leptess: tesseract/leptonica link natively, so OCR is Linux-only until the
# SP3 packaging task (see app/src/platform/windows/mod.rs).
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
pipewire = "0.10"
ashpd = { version = "0.11", features = ["tokio"] }
zbus = "5"
evdev = "0.12"
x11rb = { version = "0.13", features = ["xfixes"] }
leptess = "0.14"
ksni = "0.3.6"
